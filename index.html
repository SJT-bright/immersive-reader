<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沉浸阅读器</title>
<!--
  CSP 说明：script-src 'self' 同时禁用 EPUB 内嵌脚本（foliate-js 安全建议）；
  frame-src 允许书内 blob 渲染与网易云官方外链播放器；不放开任何其它远程资源。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob: data:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:; frame-src blob: https://music.163.com https://i.y.qq.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="css/style.css?v=1.5.5">
<link rel="stylesheet" href="css/music.css?v=2026.9.22.4">
<link rel="stylesheet" href="css/atmosphere.css?v=1.8.0">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/glass-ui.css?v=1.9.9">
<link rel="stylesheet" href="css/bookshelf.css?v=1.6.1">
<link rel="stylesheet" href="css/immersion.css?v=1.3.3">
<link rel="stylesheet" href="css/experience.css?v=2.2.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12211d">
<link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
  <div id="bg-root" aria-hidden="true"></div>
  <div id="readability-mask" aria-hidden="true"></div>

  <!-- 欢迎屏（未打开书时） -->
  <section id="welcome" class="reading-surface">
    <div class="welcome-card">
      <h1>把时间，留给阅读。</h1>
      <p class="sub">书页在眼前，风景在窗外。</p>
      <div class="welcome-actions">
        <button id="btn-welcome-open" class="primary">打开书籍</button>
      </div>
      <button id="continue-reading" class="primary continue-card" hidden></button>
      <button id="btn-welcome-background" data-background-drop title="点击打开场景图库，或把图片/视频拖到这个按钮上">更换窗外的风景</button>
      <details class="books-fold"><summary aria-label="展开或收起最近书籍" title="最近书籍"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5C8 3 4 3 2 4v15c3-1 7-.5 10 1.5 3-2 7-2.5 10-1.5V4c-2-1-6-1-10 1.5Z"/><path d="M12 5.5v15"/></svg><span class="fold-label">最近书籍</span></summary><div class="fold-body"><div id="recent-list"></div></div></details>
      <p class="builtin-note" id="storage-note">书籍与风景保存在本机。</p>
    </div>
  </section>

  <!-- 阅读列 -->
  <main id="reader-column" class="reading-surface hidden">
    <div id="reader-host">
      <div class="book-covers" aria-hidden="true"><i class="book-cover-left"></i><i class="book-cover-right"></i></div>
      <div class="book-frontispiece" aria-label="书名页"><span class="book-frontispiece-title"></span><span class="book-frontispiece-rule"></span><small>把时间，留给阅读</small><button id="book-spread-toggle" type="button">展开双页正文</button></div>
    </div>
    <div id="reader-chrome">
      <header id="reading-heading"><span id="reading-title"></span><span id="reading-progress"></span></header>

    </div>
  </main>

  <aside id="reading-dock" aria-label="自动阅读控制" title="空格键显示或隐藏操作按钮">
    <button id="page-prev" aria-label="上一页">← 上一页</button>
    <button id="auto-reading-toggle" aria-pressed="false">自动阅读</button>
    <details id="reading-speed-details"><summary>速度与设置</summary>
      <div id="reading-speed-popover" popover="auto" role="region" aria-label="阅读速度设置">
      <h3>阅读速度</h3>
      <div class="dock-presets" role="group" aria-label="速度预设">
        <button data-action="auto-preset" data-speed="10">慢</button>
        <button data-action="auto-preset" data-speed="20">适中</button>
        <button data-action="auto-preset" data-speed="40">快</button>
      </div>
      <label for="reading-speed" id="reading-speed-label">下滑速度</label>
      <input id="reading-speed" type="range" min="5" max="80" step="1" value="20">
      <output id="reading-speed-value" for="reading-speed">20 像素/秒</output>
      <button data-action="auto-settings">更多阅读设置 →</button>
      </div>
    </details>
    <button id="reading-focus-toggle" aria-pressed="false">隐藏工具</button>
    <button id="page-next" aria-label="下一页">下一页 →</button>
  </aside>

  <button id="atmosphere-toggle" aria-label="天气设置" aria-expanded="false" aria-controls="atmosphere-panel" title="天气设置"></button>
  <aside id="atmosphere-panel" aria-label="天气设置" hidden></aside>

  <!-- 迷你播放条（仅本地音乐时常驻；由 js/music-ui.js 填充） -->
  <div id="mini-player-host"></div>
  <!-- 官方播放器舞台：始终在面板外，避免关面板时 display:none 掐断声音 -->
  <div id="live-player" hidden></div>

  <aside id="reading-timer" aria-label="阅读计时"></aside>

  <div id="top-actions" aria-label="主要操作" title="空格键显示或隐藏操作按钮">
    <button id="top-settings" aria-expanded="false" aria-controls="panel" aria-label="打开控制面板" title="书架、阅读、场景与音乐">☷</button>
  </div>
  <!-- 工具栏 -->


  <!-- 设置面板 -->
  <aside id="panel" class="hidden" aria-label="阅读设置">
    <header><h2 id="panel-title">面板</h2><button id="panel-close" title="关闭">✕</button></header>
  <nav id="toolbar" aria-label="功能栏目">
    <div class="nav-main">
      <button data-cmd="open" title="书架、导入与备份"><span>书</span><label>书架</label></button>
      <button data-cmd="toc" title="目录与书内搜索"><span>目</span><label>目录</label></button>
      <button data-cmd="font" title="排版与阅读方式"><span>字</span><label>阅读</label></button>
      <button data-cmd="notes" title="划线、心得与书签"><span>✎</span><label>笔记</label></button>
      <button id="nav-more" aria-expanded="false" aria-controls="nav-secondary"><span>⋯</span><label>更多</label></button>
    </div>
    <div class="nav-secondary" id="nav-secondary" hidden>
      <button data-cmd="scene" title="阅读环境：预设、天气与背景"><label>阅读环境</label></button>
      <button data-cmd="rain" title="环境高级设置：折射率等进阶参数"><label>环境高级设置</label></button>
      <button data-cmd="music" title="音乐"><label>音乐</label></button>
      <button data-cmd="log" title="阅读时长、中断与成就"><label>阅读记录</label></button>
      <button data-cmd="fullscreen" title="全屏阅读"><label>全屏</label></button>
    </div>
  </nav>
    <div id="panel-body" class="panel-content"></div>
    <div id="music-panel-body" class="panel-content" hidden></div>
  </aside>

  <div id="selection-tools" hidden><button id="save-quote">划线</button><button id="note-quote">写想法</button><button id="cancel-quote" aria-label="取消划线">✕</button></div>
  <button id="back-reading" hidden title="回到跳转前的阅读位置">↩ 刚才的位置</button>
  <div id="toast" class="hidden" role="status"></div>

  <input id="file-book" type="file" accept=".epub,.txt,.pdf,application/pdf,application/epub+zip,text/plain" multiple hidden>
  <input id="file-image" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" multiple hidden>
  <input id="file-audio" type="file" accept="audio/mpeg,audio/mp3,audio/ogg,audio/wav,audio/flac,audio/*" multiple hidden>
  <input id="file-backup" type="file" accept=".json,application/json" hidden>

  <script type="module" src="js/main.js?v=2026.9.23.1"></script>
</body>
</html>
